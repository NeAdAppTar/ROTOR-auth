<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Дозаполнение профиля</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="background-overlay">
    <img src="pic1.jpg" alt="фон" class="background-image">
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="logo">Ротор ID</h1>
      <p class="subtitle">Завершите заполнение профиля</p>

      <form id="completeForm">
        <input type="password" id="password" placeholder="Придумайте пароль" required>
        <input type="text" id="account" placeholder="Банковский счёт" required>
        <input type="text" id="vk" placeholder="Ссылка VK" required>
        <p class="subtitle">Пример: https://vk.com/mraz123</p>
        <button type="submit">Сохранить</button>
      </form>

      <footer>
        <p>2025-2026, ООО «Ротор», by NeAdAppTar & ShaUru1118</p>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const toast = document.getElementById('toast');
  const form = document.getElementById('completeForm');
  const button = form.querySelector('button');

  function showToast(message, color = 'rgba(255, 87, 34, 0.9)') {
    toast.textContent = message;
    toast.style.backgroundColor = color;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function getCookie(name) {
    const match = document.cookie.match(
      new RegExp('(^| )' + name + '=([^;]+)')
    );
    return match ? decodeURIComponent(match[2]) : null;
  }

  const login = getCookie('userLogin');
  const passwordCookie = getCookie('userPass');

  if (!login) {
  window.location.href = "https://rotorprov.ru/index.html";
  return;
}

  try {
    // Получаем пользователя
    const response = await fetch('https://api.rotorbus.ru/users/rotor');
    const data = await response.json();

    const user = data.users.find(u => u.name === login);

    if (!user) {
      showToast("Пользователь не найден");
      return;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value.trim();
      const account = document.getElementById('account').value.trim();
      const vk = document.getElementById('vk').value.trim();

      if (!password || !account || !vk) {
        showToast("Заполните все поля");
        return;
      }

      button.disabled = true;
      button.textContent = "Сохранение...";

      const updateResponse = await fetch(
        `https://api.rotorbus.ru/user/rotor/${user.id}`,
        {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: password,
            account: account,
            vk: vk,
            note: ""
          })
        }
      );

      if (!updateResponse.ok) {
        showToast("Ошибка сохранения");
        button.disabled = false;
        button.textContent = "Сохранить";
        return;
      }

      showToast("Профиль обновлён", "rgba(76, 175, 80, 0.9)");

      setTimeout(() => {
        window.location.href =
          "https://dashboard.rotorprov.ru/employee_dashboard.html";
      }, 1000);

    });

  } catch (error) {
    console.error(error);
    showToast("Ошибка соединения с сервером");
  }

});
</script>

</body>
</html>
